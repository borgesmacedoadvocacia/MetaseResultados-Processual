<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Metas e Resultados · Processual</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
:root {
  --bg: #f5f5f3;
  --card: #ffffff;
  --border: #e5e5e3;
  --text: #1c1c1c;
  --muted: #737373;
  --green: #16a34a;
  --yellow: #ca8a04;
  --red: #dc2626;
  --accent: #0f766e;
  --accent-lt: #f0fdfa;
  --radius: 10px;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--bg);color:var(--text);font-size:13px;line-height:1.45}

/* HEADER */
.hdr{background:var(--card);border-bottom:1px solid var(--border);padding:13px 24px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:30;gap:12px}
.hdr h1{font-size:15px;font-weight:600;letter-spacing:-.01em}
.hdr p{font-size:11px;color:var(--muted);margin-top:1px}
.hdr-right{display:flex;align-items:center;gap:8px;flex-shrink:0}
.tabs{display:flex;gap:2px}
.tab-btn{padding:6px 15px;border:none;background:none;cursor:pointer;font-size:12px;color:var(--muted);border-radius:6px;transition:background .15s,color .15s;white-space:nowrap}
.tab-btn:hover{background:#f0f0ee;color:var(--text)}
.tab-btn.active{background:var(--accent);color:#fff;font-weight:500}

/* MONTH BAR */
.mbar{background:var(--card);border-bottom:1px solid var(--border);padding:9px 24px;display:flex;align-items:center;gap:6px;overflow-x:auto;scrollbar-width:none}
.mbar::-webkit-scrollbar{display:none}
.mbar-lbl{font-size:11px;color:var(--muted);font-weight:500;margin-right:2px;white-space:nowrap}
.m-btn{padding:4px 14px;border-radius:20px;border:1px solid var(--border);background:var(--card);cursor:pointer;font-size:12px;color:var(--muted);transition:all .15s;white-space:nowrap}
.m-btn:hover:not(.active){border-color:var(--accent);color:var(--accent)}
.m-btn.active{background:var(--accent);color:#fff;border-color:var(--accent);font-weight:500}

/* CONTENT */
.content{padding:18px 24px;max-width:1360px;margin:0 auto}

/* SUMMARY STRIP */
.sstrip{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin-bottom:18px}
.scard{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:13px 15px}
.scard .sl{font-size:10px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.05em}
.scard .sv{font-size:20px;font-weight:700;margin-top:4px;letter-spacing:-.02em;line-height:1.1}
.scard .ss{font-size:11px;color:var(--muted);margin-top:3px}
.scard .spct{font-size:12px;font-weight:600;margin-top:3px}

/* SECTION */
.sh{font-size:10px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;margin:18px 0 9px;display:flex;align-items:center;gap:8px}
.sh::after{content:'';flex:1;height:1px;background:var(--border)}

/* SUBSETOR BLOCK */
.sub-block{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);margin-bottom:12px;overflow:hidden}
.sub-header{padding:10px 16px;background:#fafaf8;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;gap:8px}
.sub-title{font-size:12px;font-weight:600;color:var(--text)}
.sub-pct{font-size:11px;font-weight:700;padding:2px 8px;border-radius:12px}
.sub-pct.ok{background:#dcfce7;color:#166534}
.sub-pct.warn{background:#fef9c3;color:#854d0e}
.sub-pct.bad{background:#fee2e2;color:#991b1b}
.sub-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:0;border-top:none}

/* ATIVIDADE CARD */
.atvcard{padding:12px 14px;border-right:1px solid #f0f0ee;border-bottom:1px solid #f0f0ee}
.atvcard:last-child{border-right:none}
.atv-nome{font-size:10px;color:var(--muted);font-weight:500;margin-bottom:5px;line-height:1.3}
.atv-val{font-size:18px;font-weight:700;letter-spacing:-.02em;line-height:1;margin-bottom:5px}
.atv-meta{font-size:10px;color:var(--muted);margin-bottom:4px}
.atv-pct{font-size:11px;font-weight:700}
.pbar-bg{height:3px;background:#e9e9e9;border-radius:2px;margin-top:4px;overflow:hidden}
.pbar-fill{height:100%;border-radius:2px;transition:width .4s}

/* PERIODOS TABLE dentro da atividade */
.periodos{display:flex;gap:6px;margin-top:5px;flex-wrap:wrap}
.periodo{background:#f5f5f3;border-radius:4px;padding:2px 6px;font-size:9px;color:var(--muted);text-align:center;white-space:nowrap}
.periodo span{display:block;font-weight:600;color:var(--text);font-size:10px}

/* KPI GRID (tab KPIs 2026) */
.kgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px;margin-bottom:4px}
.kcard{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:13px 14px;display:flex;flex-direction:column;transition:box-shadow .15s}
.kcard:hover{box-shadow:0 2px 10px rgba(0,0,0,.08)}
.kc-head{display:flex;align-items:center;gap:6px;margin-bottom:7px}
.kdot{width:7px;height:7px;border-radius:50%;flex-shrink:0}
.kname{font-size:11px;color:var(--muted);font-weight:500;flex:1;line-height:1.3}
.kresult{font-size:22px;font-weight:700;letter-spacing:-.03em;line-height:1;margin-bottom:9px}
.kdetails{display:flex;flex-direction:column;gap:3px;margin-bottom:8px}
.krow{display:flex;justify-content:space-between;align-items:baseline;font-size:11px}
.krow .lbl{color:var(--muted)}
.krow .val{font-weight:600}
.kpct-row{display:flex;justify-content:space-between;align-items:center;margin-bottom:5px;font-size:11px}
.kpct-row .plbl{color:var(--muted)}
.kpct-main{font-size:13px;font-weight:700}

/* AREA CARDS (liminares/sentenças/recursos) */
.area-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:4px}
.acard{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:14px 16px}
.acard-title{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);margin-bottom:10px}
.atag{padding:2px 7px;border-radius:4px;font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.04em}
.atag-g{background:#ecfdf5;color:#065f46}
.atag-s{background:#eff6ff;color:#1e40af}
.atag-b{background:#faf5ff;color:#6d28d9}
.arow{display:flex;justify-content:space-between;align-items:center;padding:5px 0;border-bottom:1px solid #f0f0ee;font-size:12px}
.arow:last-of-type{border-bottom:none}
.arow .albl{color:var(--muted)}
.arow .aval{font-weight:700;display:flex;align-items:center;gap:5px}
.arow .aval small{font-weight:400;color:var(--muted);font-size:10px}
.ataxa{margin-top:10px;padding-top:8px;border-top:1px solid var(--border)}
.ataxa-lbl{font-size:10px;color:var(--muted);margin-bottom:3px}
.ataxa-val{font-size:15px;font-weight:700}
.ataxa-bar{height:4px;background:#e9e9e9;border-radius:2px;margin-top:5px;overflow:hidden}
.ataxa-fill{height:100%;border-radius:2px;transition:width .4s}

/* ACUMULADO TAB */
.acum-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(175px,1fr));gap:10px;margin-bottom:18px}
.acum-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:14px 16px}
.acum-card .al{font-size:10px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.acum-card .av{font-size:18px;font-weight:700;letter-spacing:-.02em;margin-top:5px}
.acum-card .as{font-size:11px;color:var(--muted);margin-top:2px}
.acum-card .apct{font-size:12px;font-weight:600;margin-top:4px}
.chart-box{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:20px;margin-bottom:14px}
.chart-box h3{font-size:12px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin-bottom:14px}

/* TABLE */
.tbl-wrap{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;margin-bottom:20px}
table{width:100%;border-collapse:collapse;font-size:11.5px}
th{padding:8px 12px;text-align:left;font-size:9.5px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);background:#fafaf8;border-bottom:1px solid var(--border)}
th.r{text-align:right}
td{padding:7px 12px;border-bottom:1px solid #f0f0ee}
td.r{text-align:right;font-weight:500}
td.kn{font-weight:600}
td.sec{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);background:#fafaf8;border-bottom:1px solid var(--border)}
tr:last-child td{border-bottom:none}
tr:hover td{background:#fafaf8}
.tpct{display:inline-flex;align-items:center;gap:3px;font-weight:600}
.tdot{width:5px;height:5px;border-radius:50%;display:inline-block;flex-shrink:0}

/* STATUS */
.c-g{color:var(--green)}.c-y{color:var(--yellow)}.c-r{color:var(--red)}.c-m{color:var(--muted)}
.dot-g{background:var(--green)}.dot-y{background:var(--yellow)}.dot-r{background:var(--red)}.dot-m{background:#d1d5db}
.bar-g{background:var(--green)}.bar-y{background:var(--yellow)}.bar-r{background:var(--red)}.bar-m{background:#d1d5db}

/* MISC */
.tab-content{display:none}
.tab-content.active{display:block}
.loading-msg{color:var(--muted);font-size:12px;padding:30px 0;text-align:center}
.err-msg{color:var(--red);font-size:12px;padding:20px;text-align:center;background:var(--card);border:1px solid var(--border);border-radius:var(--radius)}
.refresh-btn{background:none;border:1px solid var(--border);border-radius:6px;padding:5px 10px;cursor:pointer;font-size:11px;color:var(--muted);transition:all .15s}
.refresh-btn:hover{border-color:var(--accent);color:var(--accent)}

@media(max-width:900px){
  .area-grid{grid-template-columns:1fr 1fr}
  .sstrip{grid-template-columns:repeat(3,1fr)}
}
@media(max-width:640px){
  .hdr{flex-wrap:wrap;padding:11px 16px}
  .content{padding:14px 16px}
  .sstrip{grid-template-columns:1fr 1fr}
  .area-grid{grid-template-columns:1fr}
  .kgrid{grid-template-columns:1fr 1fr}
}
@media(max-width:440px){
  .kgrid{grid-template-columns:1fr}
  .sstrip{grid-template-columns:1fr}
}
</style>
</head>
<body>

<div class="hdr">
  <div>
    <h1>Metas e Resultados · Processual</h1>
    <p id="hdr-sub">BM Advocacia &amp; Consultoria · carregando…</p>
  </div>
  <div class="hdr-right">
    <button class="refresh-btn" onclick="manualRefresh()">⟳ Atualizar</button>
    <div class="tabs">
      <button class="tab-btn active"  onclick="switchTab('gerais',this)">Gerais</button>
      <button class="tab-btn"         onclick="switchTab('individual',this)">Individual</button>
      <button class="tab-btn"         onclick="switchTab('kpis2026',this)">KPIs 2026</button>
    </div>
  </div>
</div>

<!-- Month bar (Gerais + Individual) -->
<div class="mbar" id="mbar-ri" style="display:none"><span class="mbar-lbl">Mês:</span></div>
<!-- Month bar (KPIs 2026) -->
<div class="mbar" id="mbar-kpi" style="display:none"><span class="mbar-lbl">Mês:</span></div>

<!-- ══ TAB: GERAIS ══ -->
<div id="tab-gerais" class="tab-content active">
  <div class="content">
    <div class="sstrip" id="sstrip-gerais"><div class="loading-msg" style="grid-column:1/-1">⟳ Carregando…</div></div>
    <div id="body-gerais"><div class="loading-msg">⟳ Carregando dados…</div></div>
    <div style="height:24px"></div>
  </div>
</div>

<!-- ══ TAB: INDIVIDUAL ══ -->
<div id="tab-individual" class="tab-content">
  <div class="content">
    <div class="sstrip" id="sstrip-ind"></div>
    <div id="body-ind"></div>
    <div style="height:24px"></div>
  </div>
</div>

<!-- ══ TAB: KPIs 2026 ══ -->
<div id="tab-kpis2026" class="tab-content">
  <div class="content">
    <div class="sstrip" id="sstrip-kpi"><div class="loading-msg" style="grid-column:1/-1">⟳ Carregando…</div></div>
    <div class="sh">Operacional</div>
    <div class="kgrid" id="g-operacional"></div>
    <div class="sh">Captação de Clientes &amp; Processos</div>
    <div class="kgrid" id="g-captacao"></div>
    <div class="sh">Relacionamento com Clientes</div>
    <div class="kgrid" id="g-relacionamento"></div>
    <div class="sh">Liminares</div>
    <div class="kgrid" id="g-lim-top"></div>
    <div class="area-grid" id="g-liminares"></div>
    <div class="sh">Sentenças</div>
    <div class="kgrid" id="g-sent-top"></div>
    <div class="area-grid" id="g-sentencas"></div>
    <div class="sh">Recursos</div>
    <div class="kgrid" id="g-rec-top"></div>
    <div class="area-grid" id="g-recursos"></div>
    <div class="sh">Financeiro</div>
    <div class="kgrid" id="g-financeiro"></div>
    <div style="height:24px"></div>
  </div>
</div>

<script>
// ══════════════════════════════════════════════════════
//  CONFIG
// ══════════════════════════════════════════════════════
const SHEET_ID  = '1MHK5vTiNq1nmvCqJLG6jacfr4inpJuvHzRyFAklKeLQ';
const GID_2026  = '38571557';   // "Resultados 2026" via gid (tem labels de mês)
const POLL_MS   = 5 * 60 * 1000;
const MESES     = ['Jan','Fev','Mar','Abr','Mai','Jun','Jul','Ago','Set','Out','Nov','Dez'];
const MFULL     = {Jan:'Janeiro',Fev:'Fevereiro',Mar:'Março',Abr:'Abril',Mai:'Maio',Jun:'Junho',Jul:'Julho',Ago:'Agosto',Set:'Setembro',Out:'Outubro',Nov:'Novembro',Dez:'Dezembro'};
const HOJE      = new Date();
const MES_IDX   = HOJE.getMonth();      // 0-based (4 = Mai)
const ANO_SUF   = String(HOJE.getFullYear()).slice(-2);  // '26'

// ══════════════════════════════════════════════════════
//  ESTADO
// ══════════════════════════════════════════════════════
let RI_DATA      = {};   // {mesAbbr: parsed subsetor data}
let RI_MESES     = [];   // available months for Gerais/Individual
let ri_sel       = null; // selected month for RI tabs

let KPI_DATA     = {};   // parsed from Resultados 2026
let KPI_MONTHS   = [];
let KPI_MEDIAS   = null;
let kpi_sel      = null;

let activeTab    = 'gerais';
let pollingTimer = null;
let lastHashRI   = '';
let lastHashKPI  = '';
let evoCharts    = [];

// ══════════════════════════════════════════════════════
//  FETCH HELPERS
// ══════════════════════════════════════════════════════
function normStr(s) {
  if (typeof s !== 'string') s = s ? String(s) : '';
  return s.normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase().trim();
}

function gvizFetch(url) {
  return fetch(url).then(function(r){ return r.text(); }).then(function(text){
    var m = text.match(/google\.visualization\.Query\.setResponse\(([\s\S]*)\)/);
    if (!m) return null;
    var json = JSON.parse(m[1]);
    return (json.status === 'error') ? null : json.table;
  }).catch(function(){ return null; });
}

function cellV(row, col) {
  if (!row || !row.c || col >= row.c.length) return null;
  var cell = row.c[col];
  return (cell && cell.v !== undefined && cell.v !== null) ? cell.v : null;
}
function cellF(row, col) {
  if (!row || !row.c || col >= row.c.length) return null;
  var cell = row.c[col];
  return cell ? (cell.f || null) : null;
}
function extractPct(row, col) {
  var f = cellF(row, col);
  var v = cellV(row, col);
  if (v === null) return null;
  if (f && String(f).includes('%')) {
    var p = parseFloat(String(f).replace('%','').replace(',','.').trim());
    return isNaN(p) ? null : p;
  }
  if (typeof v === 'number') return v * 100;
  return null;
}

// ══════════════════════════════════════════════════════
//  PARSE: RESULTADOS GERAIS / INDIVIDUAIS
// ══════════════════════════════════════════════════════
// Column layout (0-indexed):
//  0=Setor  1=Subsetor  2=Atividade  3=extra
//  4=MetaMensal  5=MetaProp  6=sep
//  7=P1  8=P2  9=P3  10=P4
//  11=financial(L)  12=Total(M)  13=%(N)  14=notes

function parseRI(table) {
  if (!table || !table.rows) return null;
  var rows = table.rows;
  var result = { subsectores: [], metaTotal: null };
  var subMap = {};

  for (var r = 0; r < rows.length; r++) {
    var row = rows[r];
    var subsNom = cellV(row, 1);
    var atvNom  = cellV(row, 2);
    if (!subsNom || !atvNom) continue;

    var subsKey = String(subsNom).trim();
    var atvKey  = String(atvNom).trim();

    // Meta Financeira Total (summary row)
    if (normStr(subsKey) === 'meta financeira' && normStr(atvKey) === 'total') {
      result.metaTotal = {
        metaMensal: cellV(row, 4),
        metaProp:   cellV(row, 5),
        p1: cellV(row, 7), p2: cellV(row, 8), p3: cellV(row, 9), p4: cellV(row, 10),
        total: cellV(row, 12),
        pct: extractPct(row, 13),
      };
      continue;
    }

    if (!subMap[subsKey]) {
      subMap[subsKey] = { nome: subsKey, atividades: [] };
      result.subsectores.push(subMap[subsKey]);
    }

    var isMoeda = normStr(atvKey).includes('financeira');
    subMap[subsKey].atividades.push({
      nome:       atvKey,
      metaMensal: cellV(row, 4),
      metaProp:   cellV(row, 5),
      p1:         cellV(row, 7),
      p2:         cellV(row, 8),
      p3:         cellV(row, 9),
      p4:         cellV(row, 10),
      total:      isMoeda ? cellV(row, 12) : cellV(row, 12),
      pct:        extractPct(row, 13),
      fmt:        isMoeda ? 'moeda' : 'numero',
    });
  }
  return result;
}

async function loadRI(mesAbbr) {
  var geraisName = 'Resultados Gerais - ' + mesAbbr + '/' + ANO_SUF;
  var indName    = 'Resultados Individuais - ' + mesAbbr + '/' + ANO_SUF;
  var base = 'https://docs.google.com/spreadsheets/d/' + SHEET_ID +
             '/gviz/tq?tqx=out:json&headers=0&sheet=';
  var [tG, tI] = await Promise.all([
    gvizFetch(base + encodeURIComponent(geraisName)),
    gvizFetch(base + encodeURIComponent(indName)),
  ]);
  var pG = tG ? parseRI(tG) : null;
  var pI = tI ? parseRI(tI) : null;
  if (!pG && !pI) return false;
  if (!RI_DATA[mesAbbr]) RI_DATA[mesAbbr] = {};
  if (pG) RI_DATA[mesAbbr].gerais     = pG;
  if (pI) RI_DATA[mesAbbr].individual = pI;
  return true;
}

// ══════════════════════════════════════════════════════
//  PARSE: KPIs 2026 (via gid=38571557, headers=1)
// ══════════════════════════════════════════════════════
const KPI_DEFS = [
  { id:'publicacoes',      nome:'Publicações',           grupo:'operacional',      fmt:'numero', dir:'maior', match:'publicacoes' },
  { id:'prazos_total',     nome:'Prazos (Total)',         grupo:'operacional',      fmt:'numero', dir:'maior', match:'prazos [total]' },
  { id:'prazos_simples',   nome:'Prazos Simples',         grupo:'operacional',      fmt:'numero', dir:'maior', match:'prazos simples' },
  { id:'prazos_complexos', nome:'Prazos Complexos',       grupo:'operacional',      fmt:'numero', dir:'maior', match:'prazos complexos' },
  { id:'audiencias',       nome:'Audiências Realizadas',  grupo:'operacional',      fmt:'numero', dir:'maior', match:'audiencias realizadas' },
  { id:'dilig_r',          nome:'Diligências Realizadas', grupo:'operacional',      fmt:'numero', dir:'maior', match:'diligencias realizadas' },
  { id:'dilig_f',          nome:'Diligências Finalizadas',grupo:'operacional',      fmt:'numero', dir:'maior', match:'diligencias finalizadas' },
  { id:'novos_clientes',   nome:'Novos Clientes',         grupo:'captacao',         fmt:'numero', dir:'maior', match:'novos clientes' },
  { id:'onboarding',       nome:'Onboarding Realizadas',  grupo:'captacao',         fmt:'numero', dir:'maior', match:'onboarding realizadas' },
  { id:'peticoes',         nome:'Petições Iniciais',      grupo:'captacao',         fmt:'numero', dir:'maior', match:'peticoes iniciais' },
  { id:'processos_dist',   nome:'Processos Distribuídos', grupo:'captacao',         fmt:'numero', dir:'maior', match:'processos distribuidos' },
  { id:'processos_rep',    nome:'Processos Repropostos',  grupo:'captacao',         fmt:'numero', dir:'info',  match:'processos repropostos' },
  { id:'feedback',         nome:'Feedback aos Clientes',  grupo:'relacionamento',   fmt:'numero', dir:'maior', match:'feedback aos clientes' },

const SECTION_MAP = {
  'publicacoes, prazos, audiencias e diligencias':'operacional',
  'mapeamentos e feedbacks aos clientes':'relacionamento',
  'novos clientes e processos':'captacao',
  'resultados de processos':null,
  'liminares':'liminares',
  'sentencas':'sentencas',
  'recursos':'recursos',
  'alvaras e acordos':'financeiro',
};
const SUBSECTION_MAP = {
  'resultado de liminares: geral':'geral','resultado de liminares: saude':'saude','resultado de liminares: bancario':'bancario',
  'resultado de sentencas: geral':'geral','resultado de sentencas: saude':'saude','resultado de sentencas: bancario':'bancario',
  'resultado de recursos: geral':'geral','resultado de recursos: saude':'saude','resultado de recursos: bancario':'bancario',
};

function parseKPI2026(table) {
  if (!table || !table.rows) return null;
  var rows = table.rows;
  var cols = table.cols || [];

  var monthCols = [], mediasCol = null, metaColIdx = 1;
  var MONTH_ABBRS = {janeiro:'Jan',fevereiro:'Fev',marco:'Mar',abril:'Abr',maio:'Mai',junho:'Jun',julho:'Jul',agosto:'Ago',setembro:'Set',outubro:'Out',novembro:'Nov',dezembro:'Dez'};

  for (var i = 0; i < cols.length; i++) {
    var lbl = normStr((cols[i] && cols[i].label) || '');
    if (lbl === 'medias') { mediasCol = {abbr:'Méd',col:i,pctCol:i+1}; }
    else if (MONTH_ABBRS[lbl]) { monthCols.push({abbr:MONTH_ABBRS[lbl],col:i,pctCol:i+1}); }
    else if (lbl.includes('meta')) { metaColIdx = i; }
  }

  var KPI_BY_MATCH = {};
  KPI_DEFS.forEach(function(d){ if(!KPI_BY_MATCH[d.match])KPI_BY_MATCH[d.match]=[];KPI_BY_MATCH[d.match].push(d); });

  var data = {};
  KPI_DEFS.forEach(function(d){ data[d.id]={meta:null,months:{},medias:{result:null,pct:null}}; });

  var curSub = null;
  for (var r = 0; r < rows.length; r++) {
    var row = rows[r];
    var nm = cellV(row, 0); if (!nm) continue;
    var n  = normStr(nm);
    if (Object.prototype.hasOwnProperty.call(SECTION_MAP, n)) { if(SECTION_MAP[n]!==null) curSub=null; continue; }
    if (Object.prototype.hasOwnProperty.call(SUBSECTION_MAP, n)) { curSub=SUBSECTION_MAP[n]; continue; }

    var cands = KPI_BY_MATCH[n];
    if (!cands) { for(var k in KPI_BY_MATCH){if(n.indexOf(k)===0){cands=KPI_BY_MATCH[k];break;}} }
    if (!cands || !cands.length) continue;

    var def = cands.length===1 ? cands[0] : (cands.find(function(d){return d.subsection===curSub;})||cands[0]);
    var meta = cellV(row, metaColIdx);
    data[def.id].meta = (meta!==null && meta!=='') ? meta : null;
    monthCols.forEach(function(mc){
      data[def.id].months[mc.abbr]={result:cellV(row,mc.col),pct:extractPct(row,mc.pctCol)};
    });
    if (mediasCol) data[def.id].medias={result:cellV(row,mediasCol.col),pct:extractPct(row,mediasCol.pctCol)};
  }
  return {monthCols:monthCols,mediasCol:mediasCol,data:data};
}

async function loadKPI2026() {
  var url = 'https://docs.google.com/spreadsheets/d/' + SHEET_ID +
    '/gviz/tq?tqx=out:json&headers=1&gid=' + GID_2026;
  var t = await gvizFetch(url);
  if (!t) return false;
  var parsed = parseKPI2026(t);
  if (!parsed) return false;
  KPI_MONTHS = parsed.monthCols;
  KPI_MEDIAS = parsed.mediasCol;
  KPI_DATA   = parsed.data;
  return true;
}

function fmtNum(v){ if(v===null||v===undefined)return'—';return Number(v).toLocaleString('pt-BR'); }
function fmtMoeda(v){
  if(v===null||v===undefined)return'—';
  var n=Number(v);
  if(n>=1000000)return'R$ '+(n/1000000).toLocaleString('pt-BR',{maximumFractionDigits:1})+'M';
  if(n>=1000)return'R$ '+(n/1000).toLocaleString('pt-BR',{maximumFractionDigits:1})+'k';
  return'R$ '+n.toLocaleString('pt-BR',{minimumFractionDigits:0,maximumFractionDigits:0});
}
function fmt(v,f){return f==='moeda'?fmtMoeda(v):fmtNum(v);}
function fmtPct(p){if(p===null||p===undefined)return'—';return Number(p).toFixed(1).replace('.',',')+'%';}

function colorInfo(pct, dir) {
  if(pct===null||dir==='info') return{cls:'c-m',dotCls:'dot-m',barCls:'bar-m'};
  var p=Number(pct);
  if(dir==='maior'){
    if(p>=100)return{cls:'c-g',dotCls:'dot-g',barCls:'bar-g'};
    if(p>=70) return{cls:'c-y',dotCls:'dot-y',barCls:'bar-y'};
    return{cls:'c-r',dotCls:'dot-r',barCls:'bar-r'};
  } else {
    if(p<=80) return{cls:'c-g',dotCls:'dot-g',barCls:'bar-g'};
    if(p<=120)return{cls:'c-y',dotCls:'dot-y',barCls:'bar-y'};
    return{cls:'c-r',dotCls:'dot-r',barCls:'bar-r'};
  }
}

function pctClass(pct, dir) {
  if(pct===null||dir==='info')return'';
  var p=Number(pct);
  if(dir==='maior') return p>=100?'ok':p>=70?'warn':'bad';
  return p<=80?'ok':p<=120?'warn':'bad';
}

function renderRI(tipo) {
  var mesData = RI_DATA[ri_sel];
  var parsed  = mesData && mesData[tipo];  // 'gerais' or 'individual'
  var sstripId = tipo==='gerais' ? 'sstrip-gerais' : 'sstrip-ind';
  var bodyId   = tipo==='gerais' ? 'body-gerais'   : 'body-ind';

  if (!parsed) {
    document.getElementById(sstripId).innerHTML = '<div class="loading-msg" style="grid-column:1/-1">Sem dados para '+ri_sel+'/'+ANO_SUF+'</div>';
    document.getElementById(bodyId).innerHTML   = '';
    return;
  }

  // Determine period count from data
  var numP = 0;
  parsed.subsectores.forEach(function(s){
    s.atividades.forEach(function(a){
      if(a.p4!==null&&a.p4!==undefined)numP=4;
      else if(a.p3!==null&&a.p3!==undefined&&numP<3)numP=3;
      else if(a.p2!==null&&a.p2!==undefined&&numP<2)numP=2;
      else if(a.p1!==null&&a.p1!==undefined&&numP<1)numP=1;
    });
  });

  // Period labels: infer from current month
  var pLabels = [];
  for(var i=0;i<numP;i++){
    var idx = MES_IDX - numP + i; // e.g. May (4) - 4 = 0 (Jan)
    if(idx>=0) pLabels.push(MESES[idx]);
    else pLabels.push('P'+(i+1));
  }

  // Summary strip
  var mt = parsed.metaTotal;
  var totalClientes = 0, metaClientes = 0;
  parsed.subsectores.forEach(function(s){
    s.atividades.forEach(function(a){
      if(normStr(a.nome)==='clientes adquiridos'){
        totalClientes += (a.total||0);
        metaClientes  += (a.metaProp||a.metaMensal||0);
      }
    });
  });
  var pctClientes = metaClientes>0 ? (totalClientes/metaClientes*100) : null;
  var ciC = colorInfo(pctClientes,'maior');
  var ciF = mt ? colorInfo(mt.pct,'maior') : {cls:'c-m'};

  document.getElementById(sstripId).innerHTML =
    sc('Meta Financeira', mt?fmtMoeda(mt.total):'—', mt?'Meta: '+fmtMoeda(mt.metaProp):'', mt?fmtPct(mt.pct):'', ciF.cls) +
    sc('Clientes Adquiridos', fmtNum(totalClientes), 'Meta prop.: '+fmtNum(metaClientes), fmtPct(pctClientes), ciC.cls) +
    scPeriodos(parsed, pLabels, numP) +
    sc('Mês', ri_sel+'/'+ANO_SUF,'','','c-m');

  // Body
  var html = '';
  parsed.subsectores.forEach(function(sub){
    // Calc subsetor % (via first atividade that has pct or meta financeira)
    var subPct = null;
    sub.atividades.forEach(function(a){
      if(subPct===null && a.pct!==null) subPct = a.pct;
      if(normStr(a.nome).includes('financeira') && a.pct!==null) subPct = a.pct;
    });

    html += '<div class="sub-block">';
    html += '<div class="sub-header">';
    html += '<span class="sub-title">'+esc(sub.nome)+'</span>';
    if(subPct!==null){
      var pc = pctClass(subPct,'maior');
      html += '<span class="sub-pct '+(pc||'')+'">'+fmtPct(subPct)+'</span>';
    }
    html += '</div>';
    html += '<div class="sub-grid">';
    sub.atividades.forEach(function(atv){
      var ci = colorInfo(atv.pct, 'maior');
      var barW = atv.pct!==null ? Math.min(Math.max(Number(atv.pct),0),150)+'%' : '0%';
      var pvs = [atv.p1, atv.p2, atv.p3, atv.p4].slice(0, numP);

      html += '<div class="atvcard">';
      html += '<div class="atv-nome">'+esc(atv.nome)+'</div>';
      html += '<div class="atv-val">'+fmt(atv.total, atv.fmt)+'</div>';
      html += '<div class="atv-meta">Meta prop.: '+fmt(atv.metaProp, atv.fmt)+'</div>';
      if(atv.pct!==null){
        html += '<div class="atv-pct '+ci.cls+'">'+fmtPct(atv.pct)+'</div>';
        html += '<div class="pbar-bg"><div class="pbar-fill '+ci.barCls+'" style="width:'+barW+'"></div></div>';
      }
      if(numP>0){
        html += '<div class="periodos">';
        pvs.forEach(function(v,i){
          html += '<div class="periodo"><span>'+fmt(v,atv.fmt)+'</span>'+(pLabels[i]||'P'+(i+1))+'</div>';
        });
        html += '</div>';
      }
      html += '</div>';
    });
    html += '</div></div>';
  });

  document.getElementById(bodyId).innerHTML = html || '<div class="err-msg">Sem dados disponíveis.</div>';
}

function scPeriodos(parsed, pLabels, numP) {
  if(!numP) return '';
  // Build period totals from Meta Financeira atividades
  var pTotals = [0,0,0,0];
  var hasMF = false;
  parsed.subsectores.forEach(function(s){
    s.atividades.forEach(function(a){
      if(normStr(a.nome).includes('financeira')&&normStr(a.nome)!=='total'){
        if(a.p1!==null){pTotals[0]+=(a.p1||0);hasMF=true;}
        if(a.p2!==null){pTotals[1]+=(a.p2||0);}
        if(a.p3!==null){pTotals[2]+=(a.p3||0);}
        if(a.p4!==null){pTotals[3]+=(a.p4||0);}
      }
    });
  });
  if(!hasMF) return '<div class="scard"><div class="sl">Períodos</div><div class="sv">'+numP+'</div><div class="ss">meses com dados</div></div>';
  var html = '<div class="scard"><div class="sl">Faturamento por Mês</div>';
  for(var i=0;i<numP;i++){
    html += '<div class="ss">'+(pLabels[i]||'P'+(i+1))+': '+fmtMoeda(pTotals[i])+'</div>';
  }
  html += '</div>';
  return html;
}

function sc(label, val, sub, pct, cls) {
  return '<div class="scard"><div class="sl">'+label+'</div>'+
    '<div class="sv">'+val+'</div>'+
    (sub?'<div class="ss">'+sub+'</div>':'')+
    (pct?'<div class="spct '+(cls||'')+'">'+pct+'</div>':'')+
    '</div>';
}
function esc(s){ return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;'); }

function getKPI(id) {
  var d = KPI_DATA[id];
  if (!d) return null;
  if (kpi_sel === 'Méd' && KPI_MEDIAS) return {result:d.medias.result, pct:d.medias.pct, meta:d.meta};
  var m = d.months[kpi_sel];
  return m ? {result:m.result, pct:m.pct, meta:d.meta} : {result:null, pct:null, meta:d.meta};
}

function kpiCard(id) {
  var def = KPI_DEFS.find(function(d){return d.id===id;});
  if(!def)return'';
  var kpi = getKPI(id);
  if(!kpi)return'';
  var ci = colorInfo(kpi.pct, def.dir);
  var bw = kpi.pct!==null?Math.min(Math.max(Number(kpi.pct),0),150)+'%':'0%';
  return '<div class="kcard">'+
    '<div class="kc-head"><div class="kdot '+ci.dotCls+'"></div><div class="kname">'+def.nome+'</div></div>'+
    '<div class="kresult">'+fmt(kpi.result,def.fmt)+'</div>'+
    '<div class="kdetails">'+(kpi.meta!==null?'<div class="krow"><span class="lbl">Meta mensal</span><span class="val">'+fmt(kpi.meta,def.fmt)+'</span></div>':'')+'</div>'+
    (def.dir!=='info'?
      '<div class="kpct-row"><span class="plbl">% da meta</span><span class="kpct-main '+ci.cls+'">'+fmtPct(kpi.pct)+'</span></div>'+
      '<div class="pbar-bg"><div class="pbar-fill '+ci.barCls+'" style="width:'+bw+'"></div></div>'

function areaCard(section, area, areaLabel, tagClass) {
  var P={liminares:{pos:'lim_def',neg:'lim_ind',pL:'Deferidas',nL:'Indeferidas',tL:'Taxa de Deferimento'},sentencas:{pos:'sent_proc',neg:'sent_impr',pL:'Procedentes',nL:'Improcedentes',tL:'Taxa de Êxito'},recursos:{pos:'rec_pos',neg:'rec_neg',pL:'Resultado Positivo',nL:'Resultado Negativo',tL:'Taxa Positiva'}}[section];
  if(!P)return'';
  var ak={geral:'geral',saude:'saude',bancario:'ban'}[area];
  var posId=P.pos+'_'+ak, negId=P.neg+'_'+ak;
  var pk=getKPI(posId)||{result:null,pct:null,meta:null};
  var nk=getKPI(negId)||{result:null,pct:null,meta:null};
  var pv=pk.result!==null?Number(pk.result):0;
  var nv=nk.result!==null?Number(nk.result):0;
  var tot=pv+nv;
  var taxa=tot>0?Math.round(pv/tot*100):null;
  var ci_p=colorInfo(pk.pct,'maior'), ci_n=colorInfo(nk.pct,'menor');
  var tc=taxa!==null?(taxa>=50?'c-g':'c-y'):'c-m';
  var tb=taxa!==null?(taxa>=50?'bar-g':'bar-y'):'bar-m';
  return '<div class="acard">'+
    '<div class="acard-title"><span class="atag '+tagClass+'">'+areaLabel+'</span></div>'+
    '<div class="arow"><span class="albl">'+P.pL+'</span><span class="aval '+ci_p.cls+'">'+(pk.result!==null?fmtNum(pk.result):'—')+(pk.meta!==null?'<small>/ '+fmtNum(pk.meta)+' meta</small>':'')+'</span></div>'+
    '<div class="arow"><span class="albl">'+P.nL+'</span><span class="aval '+ci_n.cls+'">'+(nk.result!==null?fmtNum(nk.result):'—')+(nk.meta!==null?'<small>/ '+fmtNum(nk.meta)+' meta</small>':'')+'</span></div>'+
    '<div class="ataxa"><div class="ataxa-lbl">'+P.tL+' ('+pv+' de '+tot+')</div>'+
    '<div class="ataxa-val '+tc+'">'+(taxa!==null?taxa+'%':'—')+'</div>'+
    '<div class="ataxa-bar"><div class="ataxa-fill '+tb+'" style="width:'+(taxa||0)+'%"></div></div></div>'+
  '</div>';
}

  var taxaLim=solVal>0?Math.round(totalDef/solVal*100):null;

  var taxaSent=(totalP+totalI)>0?Math.round(totalP/(totalP+totalI)*100):null;
  var ci_pd=colorInfo(pd&&pd.pct,'maior'), ci_ht=colorInfo(ht&&ht.pct,'maior'), ci_al=colorInfo(al&&al.pct,'maior');
  var ci_tl=taxaLim!==null?(taxaLim>=40?'c-g':'c-y'):'c-m';

    sc('Processos Distribuídos',pd&&pd.result!==null?fmtNum(pd.result):'—',pd&&pd.meta?'Meta: '+fmtNum(pd.meta):'',pd&&pd.pct!==null?fmtPct(pd.pct):'',ci_pd.cls)+
    sc('Honorários de Êxito',ht&&ht.result!==null?fmtMoeda(ht.result):'—',ht&&ht.meta?'Meta: '+fmtMoeda(ht.meta):'',ht&&ht.pct!==null?fmtPct(ht.pct):'',ci_ht.cls)+
    sc('Alvarás Creditados',al&&al.result!==null?fmtMoeda(al.result):'—',al&&al.meta?'Meta: '+fmtMoeda(al.meta):'',al&&al.pct!==null?fmtPct(al.pct):'',ci_al.cls)+
    sc('Taxa de Deferimento',taxaLim!==null?taxaLim+'%':'—',totalDef+' def. de '+solVal+' sol.','',ci_tl)+
    sc('Taxa de Êxito (Sent.)',taxaSent!==null?taxaSent+'%':'—',totalP+' proc. de '+(totalP+totalI),'',ci_ts);

  // Groups
  var grps = {
    'g-operacional':    KPI_DEFS.filter(function(d){return d.grupo==='operacional';}),
    'g-captacao':       KPI_DEFS.filter(function(d){return d.grupo==='captacao';}),
    'g-relacionamento': KPI_DEFS.filter(function(d){return d.grupo==='relacionamento';}),
    'g-lim-top':        KPI_DEFS.filter(function(d){return d.grupo==='lim_top';}),
    'g-sent-top':       KPI_DEFS.filter(function(d){return d.grupo==='sent_top';}),
    'g-rec-top':        KPI_DEFS.filter(function(d){return d.grupo==='rec_top';}),
    'g-financeiro':     KPI_DEFS.filter(function(d){return d.grupo==='financeiro';}),
  };
  for(var gid in grps){
    var el=document.getElementById(gid);
    if(el) el.innerHTML=grps[gid].map(function(d){return kpiCard(d.id);}).join('');
  }
  document.getElementById('g-liminares').innerHTML=areaCard('liminares','geral','Geral','atag-g')+areaCard('liminares','saude','Saúde','atag-s')+areaCard('liminares','bancario','Bancário','atag-b');
  document.getElementById('g-sentencas').innerHTML=areaCard('sentencas','geral','Geral','atag-g')+areaCard('sentencas','saude','Saúde','atag-s')+areaCard('sentencas','bancario','Bancário','atag-b');
  document.getElementById('g-recursos').innerHTML=areaCard('recursos','geral','Geral','atag-g')+areaCard('recursos','saude','Saúde','atag-s')+areaCard('recursos','bancario','Bancário','atag-b');
}

// ══════════════════════════════════════════════════════
//  MONTH BARS
// ══════════════════════════════════════════════════════
function buildMbarRI() {
  var months = RI_MESES;
  if(!months.length){document.getElementById('mbar-ri').innerHTML='<span class="mbar-lbl">Sem meses</span>';return;}
  if(!ri_sel||!months.includes(ri_sel)) ri_sel = months[months.length-1];
  document.getElementById('mbar-ri').innerHTML = '<span class="mbar-lbl">Mês:</span>' +
    months.map(function(m){
      return '<button class="m-btn'+(ri_sel===m?' active':'')+'" onclick="selRI(\''+m+'\')">'+m+'/'+ANO_SUF+'</button>';
    }).join('');
}

function buildMbarKPI() {
  var all = KPI_MONTHS.concat(KPI_MEDIAS ? [KPI_MEDIAS] : []);
  if(!all.length){document.getElementById('mbar-kpi').innerHTML='<span class="mbar-lbl">Sem meses</span>';return;}
  if(!kpi_sel||!all.find(function(m){return m.abbr===kpi_sel;})) kpi_sel = KPI_MONTHS.length?KPI_MONTHS[KPI_MONTHS.length-1].abbr:all[0].abbr;
  document.getElementById('mbar-kpi').innerHTML = '<span class="mbar-lbl">Mês:</span>' +
    all.map(function(m){
      return '<button class="m-btn'+(kpi_sel===m.abbr?' active':'')+(m.abbr==='Méd'?' medias':'')+'" onclick="selKPI(\''+m.abbr+'\')">'+
        (m.abbr==='Méd'?'⌀ Médias':m.abbr+'/'+ANO_SUF)+'</button>';
    }).join('');
}

function selRI(m){ ri_sel=m; buildMbarRI(); renderRI('gerais'); renderRI('individual'); }
function selKPI(m){ kpi_sel=m; buildMbarKPI(); renderKPI2026(); }

// ══════════════════════════════════════════════════════
//  TABS
// ══════════════════════════════════════════════════════
function showMbar() {
  document.getElementById('mbar-ri').style.display  = (activeTab==='gerais'||activeTab==='individual') ? 'flex' : 'none';
  document.getElementById('mbar-kpi').style.display = (activeTab==='kpis2026') ? 'flex' : 'none';
}

function switchTab(name, btn) {
  activeTab = name;
  document.querySelectorAll('.tab-content').forEach(function(el){el.classList.remove('active');});
  document.querySelectorAll('.tab-btn').forEach(function(b){b.classList.remove('active');});
  document.getElementById('tab-'+name).classList.add('active');
  btn.classList.add('active');
  showMbar();
  if(name==='kpis2026') renderKPI2026();
  if(name==='gerais')   renderRI('gerais');
  if(name==='individual') renderRI('individual');
}

// ══════════════════════════════════════════════════════
//  POLLING
// ══════════════════════════════════════════════════════
function hashRI(){ return JSON.stringify({ri:RI_DATA,m:RI_MESES}); }
function hashKPI(){ return JSON.stringify(KPI_DATA); }

async function pollAll() {
  // Load RI: try current month + up to 2 previous
  var toLoad = [];
  for(var i=0;i<=Math.min(MES_IDX,4);i++) toLoad.push(MESES[i]);

  var changed = false;
  var results = await Promise.allSettled(toLoad.map(function(m){ return loadRI(m); }));
  var newMeses = toLoad.filter(function(m,i){ return results[i].status==='fulfilled'&&results[i].value===true; });
  if(JSON.stringify(newMeses)!==JSON.stringify(RI_MESES)){ RI_MESES=newMeses; changed=true; }

  var kpiOk = await loadKPI2026();

  var hRI  = hashRI();
  var hKPI = hashKPI();
  if(hRI!==lastHashRI||hKPI!==lastHashKPI||changed){
    lastHashRI=hRI; lastHashKPI=hKPI;
    buildMbarRI();
    buildMbarKPI();
    renderRI('gerais');
    renderRI('individual');
    renderKPI2026();
    var now=new Date();
    document.getElementById('hdr-sub').textContent='BM Advocacia & Consultoria · atualizado '+now.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'});
  }
}

async function manualRefresh(){ lastHashRI=''; lastHashKPI=''; await pollAll(); }
document.addEventListener('visibilitychange',function(){if(!document.hidden)pollAll();});

// ══════════════════════════════════════════════════════
//  INIT
// ══════════════════════════════════════════════════════
showMbar();
(async function(){
  await pollAll();
  pollingTimer = setInterval(pollAll, POLL_MS);
})();
</script>
